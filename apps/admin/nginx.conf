server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The admin panel must never be shown inside another site or indexed by search engines.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Built files have a content hash in their name, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Single-page app: every other path is handled by the client-side router.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri /index.html;
  }
}
